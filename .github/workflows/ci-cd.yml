name: Android Build and Upload

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      play_internal:
        description: "Upload this build to Google Play internal testing (works from any branch)"
        type: boolean
        default: false

permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  BUILD_CONFIGURATION: Release
  APP_NAME: eu.fiskaltrust.androidlauncher
  MAUI_SDK: net10.0-android
  BASE_FOLDER: src/fiskaltrust.AndroidLauncher
jobs:
  buildAndroid:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          submodules: recursive
          token: ${{secrets.SUBMODULES_READ}}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x.x"

      - name: Resolve version from Nerdbank.GitVersion
        id: version
        shell: bash
        run: |
          dotnet tool install --global nbgv
          export PATH="$PATH:$HOME/.dotnet/tools"

          NBGV_SEMVER2=$(nbgv get-version -v SemVer2)
          NBGV_PRERELEASE_VERSION=$(nbgv get-version -v PrereleaseVersion)

          if [[ -n "${NBGV_PRERELEASE_VERSION}" ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            TAG_VERSION="${TAG_NAME#v}"

            if [[ "${TAG_NAME}" != "v${NBGV_SEMVER2}" ]]; then
              echo "Tag '${TAG_NAME}' must match 'v${NBGV_SEMVER2}' (v-prefixed SemVer2)."
              exit 1
            fi

            RELEASE_VERSION="${TAG_VERSION}"
          else
            RELEASE_VERSION="${NBGV_SEMVER2}"
          fi

          # Android versionCode must strictly increase for every Google Play upload.
          # Format 1YYDDDXXX (year, day of year, run number). The leading 1 keeps it above the legacy
          # launcher's YYDDDXXX codes and above 33554432, the code of the first manually published 2.0.0 build.
          VERSION_CODE="1$(date -u +%y%j)$(printf "%03d" $((GITHUB_RUN_NUMBER % 1000)))"

          echo "Release Version: ${RELEASE_VERSION}"
          echo "Version Code: ${VERSION_CODE}"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Extract Android signing key from env
        shell: bash
        run: |
          mkdir android
          echo "${{secrets.ANDROID_KEYSTORE_FILE }}" > android/release.jks.base64
          base64 -d android/release.jks.base64 > android/release.decrypted.jks
          realpath android/release.decrypted.jks

      - name: Install android workload
        shell: bash
        run: |
          dotnet workload install maui-android

      - name: Build Android App
        shell: bash
        run: |
          dotnet publish ${{env.BASE_FOLDER}}/fiskaltrust.AndroidLauncher.csproj \
            -f ${{env.MAUI_SDK}} \
            -c ${{env.BUILD_CONFIGURATION}} \
            -p:AndroidEnableR8=true \
            -p:AndroidLinkTool=r8 \
            -p:NBGV_SetMauiVersionProperties=false \
            -p:ApplicationVersion=${{ steps.version.outputs.version_code }} \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.release_version }} \
            -p:AndroidSigningKeyPass="${{secrets.SIGNING_KEY_PASSWORD}}" \
            -p:AndroidSigningStorePass="${{secrets.SIGNING_STORE_PASSWORD}}" \
            -p:AndroidSigningKeyStore="${{github.workspace}}/android/release.decrypted.jks" \
            -p:AndroidSigningKeyAlias="fiskaltrust-build" \
            -p:AndroidKeyStore=true

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-android
          path: |
            ${{env.BASE_FOLDER}}/bin/${{env.BUILD_CONFIGURATION}}/${{env.MAUI_SDK}}/publish/**

  smoke-tests:
    needs: buildAndroid
    uses: ./.github/workflows/smoke-tests.yml
    secrets: inherit

  release:
    needs: [buildAndroid, smoke-tests]
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || inputs.play_internal
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.buildAndroid.outputs.release_version }}
      NBGV_IS_PRERELEASE: ${{ needs.buildAndroid.outputs.is_prerelease }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: artifacts-android
          path: artifacts-android

      - name: Locate built artifacts
        id: artifacts
        run: |
          echo "apk=$(find artifacts-android -name 'eu.fiskaltrust.androidlauncher-Signed.apk')" >> "$GITHUB_OUTPUT"
          echo "aab=$(find artifacts-android -name 'eu.fiskaltrust.androidlauncher-Signed.aab')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ env.NBGV_IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}

      - name: Upload artifacts to Azure Storage
        if: "github.ref_name == 'main'"
        shell: bash
        run: |
          az storage blob upload --account-name ${{vars.storageaccountname}} --account-key ${{secrets.storageaccountkey}} --container-name downloads --file ${{ steps.artifacts.outputs.apk }} --name android/fiskaltrust-middleware-launcher-android/preview/${{env.RELEASE_VERSION}}/eu.fiskaltrust.androidlauncher-Signed-${{env.RELEASE_VERSION}}.apk
          az storage blob upload --account-name ${{vars.storageaccountname}} --account-key ${{secrets.storageaccountkey}} --container-name downloads --file ${{ steps.artifacts.outputs.aab }} --name android/fiskaltrust-middleware-launcher-android/preview/${{env.RELEASE_VERSION}}/eu.fiskaltrust.androidlauncher-Signed-${{env.RELEASE_VERSION}}.aab
          az storage blob upload --account-name ${{vars.storageaccountname}} --account-key ${{secrets.storageaccountkey}} --container-name downloads --file ${{ steps.artifacts.outputs.apk }} --name android/fiskaltrust-middleware-launcher-android/preview/eu.fiskaltrust.androidlauncher-Signed.apk --overwrite
          az storage blob upload --account-name ${{vars.storageaccountname}} --account-key ${{secrets.storageaccountkey}} --container-name downloads --file ${{ steps.artifacts.outputs.aab }} --name android/fiskaltrust-middleware-launcher-android/preview/eu.fiskaltrust.androidlauncher-Signed.aab --overwrite

      # Google Play track per trigger:
      #   push to main, or manual run with "play_internal" ticked (any branch) -> internal testing
      #   prerelease tag    -> closed testing (alpha)
      #   release tag       -> production, as a draft that is rolled out manually in the Play Console
      - name: Select Google Play track
        id: play
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "track=internal" >> "$GITHUB_OUTPUT"
            echo "status=completed" >> "$GITHUB_OUTPUT"
          elif [[ "${NBGV_IS_PRERELEASE}" == "true" ]]; then
            echo "track=alpha" >> "$GITHUB_OUTPUT"
            echo "status=completed" >> "$GITHUB_OUTPUT"
          else
            echo "track=production" >> "$GITHUB_OUTPUT"
            echo "status=draft" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.APP_NAME }}
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          releaseName: ${{ env.RELEASE_VERSION }}
          track: ${{ steps.play.outputs.track }}
          status: ${{ steps.play.outputs.status }}
